# BRB for iPhone and Apple Watch. Generate the Xcode project with XcodeGen:
#   brew install xcodegen && cd ios && xcodegen && open BRB.xcodeproj
# (ios/open.sh does exactly that.) The project is generated, not committed.
name: BRB
options:
  bundleIdPrefix: com.allen
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"
knownRegions: [en, zh-Hans]
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # your team's id, for running on a device
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ENABLE_MODULES: YES
    ENABLE_PREVIEWS: YES
configs:
  Debug: debug
  Release: release

targets:
  BRB:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    dependencies:
      - target: BRBWidgets
      - target: BRBNotifications
      - target: BRBWatch
    entitlements:
      path: App/BRB.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.com.allen.brb]
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: .generated/BRB-Info.plist
      properties:
        CFBundleDisplayName: BRB
        CFBundleLocalizations: [en, zh-Hans]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [remote-notification]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSCameraUsageDescription: The camera only reads the code on your Mac. Nothing is photographed or recorded.
        NSFaceIDUsageDescription: Confirms it's you before you disarm an alarm or stop guarding.
        NSPhotoLibraryAddUsageDescription: Saves the photos of an alarm and the cards you share to your Photos.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes: []
        CFBundleURLTypes:
          - CFBundleURLName: com.allen.brb
            CFBundleURLSchemes: [brb]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allen.brb
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: BRB
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    scheme:
      testTargets: [BRBTests]
      gatherCoverageData: false

  BRBWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Resources
    entitlements:
      path: Widgets/BRBWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.allen.brb]
    info:
      path: .generated/BRBWidgets-Info.plist
      properties:
        CFBundleDisplayName: BRB
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allen.brb.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  BRBNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
      - path: Shared/Core
    info:
      path: .generated/BRBNotifications-Info.plist
      properties:
        CFBundleDisplayName: BRB
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allen.brb.notifications
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  BRBWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
      - path: Resources
    info:
      path: .generated/BRBWatch-Info.plist
      properties:
        CFBundleDisplayName: BRB
        CFBundleLocalizations: [en, zh-Hans]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.allen.brb
        WKRunsIndependentlyOfCompanionApp: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allen.brb.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES

  BRBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      - path: Shared/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.allen.brb.tests
        GENERATE_INFOPLIST_FILE: YES
