<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3354"/>
      <stop offset="1" stop-color="#0c1122"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.5">
      <stop offset="0" stop-color="#f6b544" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#f6b544" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf6e"/>
      <stop offset="1" stop-color="#ec9f22"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#6b3c00" flood-opacity="0.55"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- a frosted pane across the tile, as on the guarded screen -->
    <rect x="100" y="100" width="824" height="824" fill="url(#frost)"/>
    <path d="M100 640 C 330 560, 640 720, 924 600 L924 924 L100 924 Z" fill="#ffffff" opacity="0.035"/>
  </g>
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <g transform="translate(512 518) scale(24) translate(-12 -12.15)" filter="url(#soft)">
    <path d="M12 2.8 L19.4 5.6 L19.4 11.4 C19.4 16.2 16.3 20 12 21.5 C7.7 20 4.6 16.2 4.6 11.4 L4.6 5.6 Z" fill="url(#amber)"/>
    <path d="M12 3.4 L18.8 6 L18.8 11.4 C18.8 13.4 18.2 15.2 17.1 16.7 C14 11 9 8.5 5.2 8.6 L5.2 6 Z" fill="#ffffff" opacity="0.18"/>
    <circle cx="12" cy="11.4" r="2.4" fill="#2b1a00"/>
  </g>
</svg>
