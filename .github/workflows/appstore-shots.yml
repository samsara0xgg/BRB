name: App Store screenshots

# Temporary: the 6.9-inch iPhone screenshots App Store Connect asks for, in English and Chinese, from the
# demo scenes, put on the ci-shots-appstore branch (and in the run's artifacts). Removed before merging.
on:
  pull_request:
    paths: [".github/workflows/appstore-shots.yml"]

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen
      - name: Build the app and the widget gallery for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          for scheme in BRB BRBGallery; do
            xcodebuild -project BRB.xcodeproj -scheme $scheme -configuration Debug \
              -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' -derivedDataPath "$RUNNER_TEMP/dd" \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)" | sort -u | head -40
          done
      - name: Take the screenshots
        run: |
          products="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          out="$RUNNER_TEMP/shots"
          mkdir -p "$out"
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          for devs in json.load(sys.stdin)["devices"].values():
              for d in devs:
                  if d["name"] == "iPhone 17 Pro Max": print(d["udid"]); raise SystemExit')
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl bootstatus "$udid" -b >/dev/null 2>&1
          xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl ui "$udid" appearance dark
          xcrun simctl install "$udid" "$products/BRB.app"
          xcrun simctl install "$udid" "$products/BRBGallery.app"
          shot() {  # name, bundle, arguments
            local name=$1 bundle=$2; shift 2
            for lang in en zh; do
              local extra=()
              [ $lang = zh ] && extra=(-AppleLanguages "(zh-Hans)" -AppleLocale zh_CN)
              xcrun simctl terminate "$udid" "$bundle" >/dev/null 2>&1
              xcrun simctl launch "$udid" "$bundle" "$@" "${extra[@]}" >/dev/null || { echo "launch failed: $name $lang"; continue; }
              sleep 5
              xcrun simctl io "$udid" screenshot --type=png "$out/$lang-$name.png" >/dev/null 2>&1 && echo "shot $lang-$name"
            done
          }
          shot 1-alarm com.allen.brb -demo 1 -scene siren -open alarm
          shot 2-start com.allen.brb -demo 1 -scene idle -open start
          shot 3-warning com.allen.brb -demo 1 -scene warn -open alarm
          shot 4-history com.allen.brb -demo 1 -scene done -open records
          shot 5-privacy com.allen.brb -demo 1 -scene armed -open privacy
          shot 6-mac com.allen.brb -demo 1 -scene armed -open mac
          shot 7-devices com.allen.brb -demo 1 -scene armed
          shot 8-welcome com.allen.brb -demo 1 -scene empty -onb welcome
          shot 9-live com.allen.brb.gallery -page live1
          shot 10-island com.allen.brb.gallery -page island1
          shot 11-home com.allen.brb.gallery -page home1
          sips -g pixelWidth -g pixelHeight "$out/en-1-alarm.png"
      - uses: actions/upload-artifact@v4
        with:
          name: appstore-screenshots
          path: ${{ runner.temp }}/shots
      - name: Publish to the ci-shots-appstore branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$RUNNER_TEMP/pub" && mkdir "$RUNNER_TEMP/pub" && cd "$RUNNER_TEMP/pub"
          git init -q -b ci-shots-appstore
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          cp "$RUNNER_TEMP"/shots/*.png .
          echo "${{ github.event.pull_request.head.sha }}" > SHA
          git add -A
          git commit -q -m "App Store screenshots ${{ github.event.pull_request.head.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:ci-shots-appstore
