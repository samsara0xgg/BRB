name: Build

# Pull requests, main and by hand.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Build the app
        run: SIGN_IDENTITY=- ./build.sh
      - name: Check Info.plist and the strings
        run: |
          plutil -lint Info.plist Resources/*.lproj/*.strings
          python3 scripts/check-strings.py
      - name: Selftest without hardware
        run: build/BRB.app/Contents/MacOS/brb selftest --no-hardware
      - name: Check the relay's syntax
        run: cp relay/worker.js "$RUNNER_TEMP/worker.mjs" && node --check "$RUNNER_TEMP/worker.mjs"
      # What someone who downloads the repo goes through: a ZIP like GitHub's "Download ZIP"
      # (git archive keeps the executable bits), unpacked into a folder with a space in its name.
      - name: Install from a downloaded copy
        run: |
          dir="$HOME/Downloads/BRB download"
          mkdir -p "$dir"
          git archive --format=zip -o "$RUNNER_TEMP/brb.zip" HEAD
          unzip -q "$RUNNER_TEMP/brb.zip" -d "$dir"
          cd "$dir"
          ./install.sh < /dev/null
          ./scripts/sleep-rule.sh
          sudo cat /etc/sudoers.d/brb
          sleep 6
          launchctl print "gui/$(id -u)/com.allen.guard-mode" | grep -E "^\s*(state|pid|program) ="
          plutil -lint ~/Library/LaunchAgents/com.allen.guard-mode.plist
          grep -q "$dir/build/BRB.app" ~/Library/LaunchAgents/com.allen.guard-mode.plist
          launchctl print "gui/$(id -u)/com.allen.guard-mode" | grep -q "state = running"
          if pgrep -f brb-relaunch; then echo "launchd restarts this copy; no watcher wanted" >&2; exit 1; fi
          tail -5 ~/Library/Logs/brb.log
          ./uninstall.sh < /dev/null
          test ! -e ~/Library/LaunchAgents/com.allen.guard-mode.plist
          sleep 3  # bootout is async
          ! pgrep -f "$dir/build/BRB.app"
      # What someone who downloads BRB.dmg goes through, with an ad hoc signature in place of the
      # notarized one scripts/release.sh makes on the author's Mac.
      - name: Install from the disk image
        run: |
          LOCAL=1 scripts/release.sh
          mnt="$RUNNER_TEMP/brb-dmg"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" dist/BRB.dmg > /dev/null
          test -L "$mnt/Applications"
          ditto "$mnt/BRB.app" /Applications/BRB.app
          hdiutil detach -quiet "$mnt"
          codesign -d --entitlements - /Applications/BRB.app 2>&1 | grep -q com.apple.security.device.camera
          sudo /Applications/BRB.app/Contents/MacOS/brb lid-rule "$(id -un)" --no-prompt
          sudo grep -q "^$(id -un) ALL=(root) NOPASSWD: /usr/bin/pmset -a disablesleep 1" /etc/sudoers.d/brb
          sudo visudo -cf /etc/sudoers.d/brb
          sudo rm /etc/sudoers.d/brb
          : > ~/Library/Logs/brb.log
          open /Applications/BRB.app
          sleep 6
          pgrep -x brb
          cat ~/Library/Logs/brb.log
          grep -q "login items" ~/Library/Logs/brb.log
          grep -q "relaunch watcher started" ~/Library/Logs/brb.log
          # A crash or kill -9 brings this copy back, as launchd does for install.sh's; SIGTERM ends it.
          first=$(pgrep -x brb)
          kill -9 "$first"
          sleep 15
          second=$(pgrep -x brb)
          test "$second" != "$first"
          pkill -TERM -x brb
          sleep 5
          if pgrep -x brb; then echo "came back after SIGTERM" >&2; exit 1; fi
          if pgrep -f brb-relaunch; then echo "watcher left running" >&2; exit 1; fi

  # The iPhone app, its widgets and notification extension, and the Apple Watch app. No signing: this
  # only proves it compiles and its tests pass. The project is generated from ios/project.yml.
  ios:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun simctl list devices available | head -40
      - name: Check the strings
        run: |
          plutil -lint ios/Resources/*.lproj/*.strings ios/Resources/*.lproj/*.stringsdict
          python3 ios/scripts/check-strings.py
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        working-directory: ios
        run: xcodegen
      - name: Build the app, widgets, notification extension and Watch app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BRB.xcodeproj -scheme BRB -configuration Debug \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee "$RUNNER_TEMP/build.log" | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)" | sort -u | head -150
      - name: Unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project BRB.xcodeproj -scheme BRB -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' CODE_SIGNING_ALLOWED=NO test 2>&1 \
            | tee "$RUNNER_TEMP/test.log" | grep -E "error:|Test Case .* (passed|failed)|Executed [0-9]+ tests|TEST (SUCCEEDED|FAILED)" | head -80
