name: Relay

# The Cloudflare Worker in relay/: its syntax, the unit tests for the push logic, and the whole worker
# run locally with `wrangler dev` against a fake Mac and fake phones. Pull requests and main, when the
# relay changed, and by hand.
on:
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  push:
    branches: [main]
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - name: Syntax
        run: |
          for module in worker apns site; do
            cp "$module.js" "$RUNNER_TEMP/$module.mjs"
            node --check "$RUNNER_TEMP/$module.mjs"
          done
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        run: npm test
